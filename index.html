<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Weebji HQ</title>
<meta name="theme-color" content="#08080c">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#08080c; --panel:#111119; --panel2:#171722; --line:rgba(255,255,255,.08);
    --txt:#f2f2f5; --mut:#8b8b97; --cyan:#19d3e6; --grn:#2ec26b; --amb:#ffb020;
    --red:#ff4d4d; --blu:#3a97ff; --pur:#a774ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    line-height:1.4;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px;width:100%;background:var(--panel2);
    border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--txt);outline:none}
  input:focus,select,textarea:focus{border-color:rgba(25,211,230,.5)}
  select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238b8b97' stroke-width='1.6' fill='none'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center}
  textarea{resize:vertical;min-height:70px}
  .hidden{display:none!important}

  /* ---- login ---- */
  #login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
  #login img{width:74px;height:74px;border-radius:20px}
  #login h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
  #login p{color:var(--mut);font-size:15px;max-width:300px}
  .g-btn{display:flex;align-items:center;gap:11px;background:#fff;color:#111;font-weight:600;font-size:15px;
    padding:13px 22px;border-radius:13px}
  .g-btn svg{width:19px;height:19px}

  /* ---- app shell ---- */
  header{position:sticky;top:0;z-index:20;background:rgba(8,8,12,.82);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    display:flex;align-items:center;gap:10px}
  header .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.3px;font-size:17px;margin-right:auto}
  header .brand img{width:26px;height:26px;border-radius:7px}
  .icon-btn{width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
    display:grid;place-items:center;font-size:16px}
  .icon-btn.on{background:rgba(46,194,107,.16);border-color:rgba(46,194,107,.4)}
  main{max-width:760px;margin:0 auto;padding:16px 16px 90px}

  /* ---- summary ---- */
  .sum{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
  .sum .card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px}
  .sum .lbl{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
  .sum .val{font-size:22px;font-weight:800;letter-spacing:-.5px}
  .sum .val small{font-size:12px;color:var(--mut);font-weight:600}
  .sum .val .cur{display:block;font-size:15px}
  .sum .val .cur+.cur{margin-top:2px}

  /* ---- tabs ---- */
  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:6px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;font-size:13px;font-weight:600;padding:8px 14px;border-radius:20px;
    background:var(--panel);border:1px solid var(--line);color:var(--mut)}
  .tab.active{background:var(--txt);color:#000;border-color:var(--txt)}
  .tab .n{opacity:.6;margin-left:4px}

  /* ---- client card ---- */
  .list{display:flex;flex-direction:column;gap:10px}
  .empty{text-align:center;color:var(--mut);padding:60px 20px;font-size:15px}
  .cli{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px 15px;
    display:flex;flex-direction:column;gap:9px;transition:border-color .15s}
  .cli:active{border-color:rgba(25,211,230,.5)}
  .cli .top{display:flex;align-items:center;gap:9px}
  .cli .nm{font-weight:700;font-size:16px;letter-spacing:-.2px;margin-right:auto;display:flex;align-items:center;gap:7px}
  .cli .new-dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
  .st-lead{background:rgba(58,151,255,.16);color:#78b6ff}
  .st-in_talks{background:rgba(167,116,255,.16);color:#c3a0ff}
  .st-active{background:rgba(25,211,230,.16);color:#5fe0ef}
  .st-delivered{background:rgba(255,176,32,.16);color:#ffca6b}
  .st-paid{background:rgba(46,194,107,.18);color:#5cd98e}
  .st-lost{background:rgba(255,77,77,.14);color:#ff8585}
  .cli .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--mut)}
  .cli .meta b{color:var(--txt);font-weight:600}
  .cli .meta .over{color:var(--red);font-weight:700}
  .src{font-size:10px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:.5px}

  /* ---- fab ---- */
  .fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;
    width:56px;height:56px;border-radius:18px;background:var(--txt);color:#000;font-size:28px;font-weight:300;
    display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}

  /* ---- modal ---- */
  .modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
    display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--panel);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;
    border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:none;
    padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
  @media(min-width:600px){.modal-bg{align-items:center}.sheet{border-radius:22px;max-height:88dvh}}
  .sheet h2{font-size:19px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
  .sheet .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .fg{margin-bottom:12px}
  .fg label{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .save{width:100%;background:var(--txt);color:#000;font-weight:700;font-size:16px;padding:14px;border-radius:13px;margin-top:6px}
  .del{width:100%;background:transparent;color:var(--red);font-weight:600;font-size:14px;padding:12px;margin-top:8px}
  .close{width:100%;background:var(--panel2);color:var(--mut);font-weight:600;padding:12px;border-radius:12px;margin-top:8px}
  .log{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  .log h3{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
  .log-item{font-size:13px;color:var(--txt);padding:8px 0;border-bottom:1px solid var(--line)}
  .log-item .t{color:var(--mut);font-size:11px;margin-top:2px}
  .note-row{display:flex;gap:8px;margin-top:10px}
  .note-row input{flex:1}
  .note-row button{background:var(--cyan);color:#000;font-weight:700;padding:0 16px;border-radius:11px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));
    z-index:80;background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:14px;font-weight:600;
    padding:11px 18px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <img src="./icon-192.png" alt="Weebji HQ">
  <div>
    <h1>Weebji HQ</h1>
    <p>Your private command center. Every lead and client, one place.</p>
  </div>
  <div id="login-step1" style="display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px">
    <input id="login-email" type="email" placeholder="you@email.com" value="sahil.kumar.chindalia@gmail.com" autocomplete="email">
    <button class="g-btn" id="send-code" style="justify-content:center">Email me a login code</button>
  </div>
  <div id="login-step2" class="hidden" style="display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px">
    <input id="login-code" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" style="text-align:center;letter-spacing:6px;font-size:20px;font-weight:700">
    <button class="g-btn" id="verify-code" style="justify-content:center">Verify & sign in</button>
    <button class="close" id="back-email" style="margin:0">Use a different email</button>
  </div>
  <p id="login-msg" style="font-size:13px" class="hidden"></p>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <div class="brand"><img src="./icon-192.png" alt="">Weebji HQ</div>
    <button class="icon-btn" id="bell" title="Enable lead alerts">🔔</button>
    <button class="icon-btn" id="refresh" title="Refresh">↻</button>
    <button class="icon-btn" id="signout" title="Sign out">⎋</button>
  </header>
  <main>
    <div class="sum" id="summary"></div>
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
  </main>
  <button class="fab" id="add">+</button>
</div>

<div id="toast" class="toast"></div>

<script>
function initApp(){
const SUPA_URL = 'https://nmhxrathmbyntpsihmqa.supabase.co';
const SUPA_KEY = 'sb_publishable_Sw2TyzTk8QYwXDrZRvu0fw_uGdZ6hwI';
const VAPID_PUBLIC = 'BHf0wVpg2v65hacqUSQnPdRT5KwNtSVJ2tdjclO9agebbnWao11y6dbtPoDa3Cn6fWkAU1FHfkV12ThGcfyJdik';
const OWNER_EMAIL = 'sahil.kumar.chindalia@gmail.com';

const sb = supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });

const STAGES = [
  { k:'lead', l:'Lead' }, { k:'in_talks', l:'In Talks' }, { k:'active', l:'Active' },
  { k:'delivered', l:'Delivered' }, { k:'paid', l:'Paid' }, { k:'lost', l:'Lost' },
];
const SERVICES = ['Restaurant QR Menu','Web Development','App Development','Video Content','Social Media','Other'];
const COUNTRIES = [['','—'],['oman','🇴🇲 Oman'],['india','🇮🇳 India'],['other','🌍 Other']];
const CUR = [['','—'],['OMR','OMR'],['INR','INR']];

let CLIENTS = [], FILTER = 'all', currentId = null;

const $ = s => document.querySelector(s);
const el = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };
const esc = s => (s??'').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function money(n,cur){ n=Number(n||0); return (cur==='OMR'?n.toFixed(3):n.toLocaleString(undefined,{maximumFractionDigits:2}))+(cur?(' '+cur):''); }
function fmtDate(d){ if(!d) return ''; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
function svcLabel(s){ return s||'Enquiry'; }
function countryFlag(c){ return ({oman:'🇴🇲',india:'🇮🇳',other:'🌍'})[c]||''; }

/* ---------- auth (passwordless email code) ---------- */
function loginMsg(m, err){ const e=$('#login-msg'); e.textContent=m; e.style.color=err?'var(--red)':'var(--mut)'; e.classList.remove('hidden'); }
$('#send-code').onclick = async () => {
  const email = $('#login-email').value.trim().toLowerCase();
  if(!email){ loginMsg('Enter your email', true); return; }
  $('#send-code').textContent='Sending…';
  const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true, emailRedirectTo: location.href.split('#')[0] } });
  $('#send-code').textContent='Email me a login code';
  if(error){ loginMsg(error.message, true); return; }
  $('#login-step1').classList.add('hidden');
  $('#login-step2').classList.remove('hidden');
  loginMsg('Code sent to '+email+'. Check inbox + spam.');
  $('#login-code').focus();
};
$('#verify-code').onclick = async () => {
  const email = $('#login-email').value.trim().toLowerCase();
  const token = $('#login-code').value.trim();
  if(token.length < 6){ loginMsg('Enter the 6-digit code', true); return; }
  $('#verify-code').textContent='Verifying…';
  const { error } = await sb.auth.verifyOtp({ email, token, type:'email' });
  $('#verify-code').textContent='Verify & sign in';
  if(error){ loginMsg(error.message, true); return; }
  // success -> onAuthStateChange fires boot()
};
$('#login-code').addEventListener('keydown', e => { if(e.key==='Enter') $('#verify-code').click(); });
$('#back-email').onclick = () => { $('#login-step2').classList.add('hidden'); $('#login-step1').classList.remove('hidden'); $('#login-msg').classList.add('hidden'); };
$('#signout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $('#login').classList.remove('hidden'); return; }
  if(session.user.email !== OWNER_EMAIL){
    await sb.auth.signOut();
    $('#login').classList.remove('hidden');
    const e=$('#login-msg'); e.textContent="That account isn't authorized."; e.style.color='var(--red)'; e.classList.remove('hidden');
    return;
  }
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  await load();
  subscribeRealtime();
  refreshBell();
}
sb.auth.onAuthStateChange((_e,s)=>{ if(s && $('#app').classList.contains('hidden')) boot(); });

/* ---------- data ---------- */
async function load(){
  const { data, error } = await sb.from('hq_clients').select('*').order('created_at',{ascending:false});
  if(error){ toast('Load failed'); return; }
  CLIENTS = data||[];
  render();
}
$('#refresh').onclick = () => load().then(()=>toast('Refreshed'));

function subscribeRealtime(){
  sb.channel('hq_clients_rt')
    .on('postgres_changes',{event:'*',schema:'public',table:'hq_clients'}, (p)=>{
      if(p.eventType==='INSERT'){ CLIENTS.unshift(p.new); toast('🎯 New lead: '+p.new.name); }
      else if(p.eventType==='UPDATE'){ const i=CLIENTS.findIndex(c=>c.id===p.new.id); if(i>-1)CLIENTS[i]=p.new; }
      else if(p.eventType==='DELETE'){ CLIENTS=CLIENTS.filter(c=>c.id!==p.old.id); }
      render();
    }).subscribe();
}

/* ---------- render ---------- */
function render(){
  // summary
  const active = CLIENTS.filter(c=>!['paid','lost'].includes(c.stage));
  const pipe={}, coll={};
  CLIENTS.forEach(c=>{
    const cur=c.currency||'—';
    if(!['paid','lost'].includes(c.stage)) pipe[cur]=(pipe[cur]||0)+Number(c.deal_value||0);
    if(Number(c.amount_paid)>0) coll[cur]=(coll[cur]||0)+Number(c.amount_paid||0);
  });
  const overdue = CLIENTS.filter(c=>c.next_action_date && c.next_action_date<today() && !['paid','lost'].includes(c.stage)).length;
  const leads = CLIENTS.filter(c=>c.stage==='lead').length;
  const curLines = o => { const k=Object.keys(o).filter(x=>x!=='—'); return k.length? k.map(x=>`<span class="cur">${money(o[x],x)}</span>`).join(''):'<span class="cur" style="color:var(--mut)">—</span>'; };
  $('#summary').innerHTML =
    `<div class="card"><div class="lbl">Active clients</div><div class="val">${active.length} <small>· ${leads} new</small></div></div>`+
    `<div class="card"><div class="lbl">Follow-ups due</div><div class="val" style="color:${overdue?'var(--red)':'var(--txt)'}">${overdue}</div></div>`+
    `<div class="card"><div class="lbl">Open pipeline</div><div class="val">${curLines(pipe)}</div></div>`+
    `<div class="card"><div class="lbl">Collected</div><div class="val">${curLines(coll)}</div></div>`;

  // tabs
  const counts={all:CLIENTS.length}; STAGES.forEach(s=>counts[s.k]=CLIENTS.filter(c=>c.stage===s.k).length);
  const tabDef=[['all','All'],...STAGES.map(s=>[s.k,s.l])];
  $('#tabs').innerHTML = tabDef.map(([k,l])=>
    `<button class="tab ${FILTER===k?'active':''}" data-f="${k}">${l}<span class="n">${counts[k]||0}</span></button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(t=>t.onclick=()=>{FILTER=t.dataset.f;render();});

  // list
  const rows = FILTER==='all'?CLIENTS:CLIENTS.filter(c=>c.stage===FILTER);
  const list=$('#list');
  if(!rows.length){ list.innerHTML=`<div class="empty">Nothing here yet.<br>Leads from your portfolio land here automatically.</div>`; return; }
  list.innerHTML='';
  rows.forEach(c=>{
    const over = c.next_action_date && c.next_action_date<today() && !['paid','lost'].includes(c.stage);
    const isNew = c.stage==='lead' && c.source==='portfolio';
    const node = el(
      `<div class="cli" data-id="${c.id}">
        <div class="top">
          <div class="nm">${isNew?'<span class="new-dot"></span>':''}${esc(c.name)}</div>
          <span class="pill st-${c.stage}">${STAGES.find(s=>s.k===c.stage)?.l||c.stage}</span>
        </div>
        <div class="meta">
          <span>${countryFlag(c.country)} ${esc(svcLabel(c.service))}</span>
          ${Number(c.deal_value)>0?`<span>Deal <b>${money(c.deal_value,c.currency)}</b></span>`:''}
          ${Number(c.amount_paid)>0?`<span>Paid <b>${money(c.amount_paid,c.currency)}</b></span>`:''}
          ${c.next_action_date?`<span class="${over?'over':''}">⏰ ${fmtDate(c.next_action_date)}</span>`:''}
          ${c.source==='portfolio'?'<span class="src">portfolio</span>':''}
        </div>
      </div>`);
    node.onclick=()=>openDetail(c.id);
    list.appendChild(node);
  });
}

/* ---------- detail / edit ---------- */
function field(label,inner){ return `<div class="fg"><label>${label}</label>${inner}</div>`; }
function opts(arr,val){ return arr.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${v}" ${v===val?'selected':''}>${l}</option>`;}).join(''); }

async function openDetail(id){
  currentId = id;
  const c = id ? CLIENTS.find(x=>x.id===id) : { stage:'lead', source:'manual', currency:'', country:'', deal_value:0, amount_paid:0 };
  const isNew = !id;
  const bg = el(`<div class="modal-bg"></div>`);
  bg.appendChild(el(
    `<div class="sheet" onclick="event.stopPropagation()">
      <h2>${isNew?'New client':esc(c.name)}</h2>
      <div class="sub">${isNew?'Add someone to track':'Update stage, money, follow-up & notes'}</div>
      ${field('Name','<input id="f-name" value="'+esc(c.name||'')+'">')}
      <div class="row2">${field('Email','<input id="f-email" value="'+esc(c.email||'')+'">')}${field('Phone','<input id="f-phone" value="'+esc(c.phone||'')+'">')}</div>
      <div class="row2">${field('Service','<select id="f-service">'+opts([['','—'],...SERVICES],c.service||'')+'</select>')}${field('Country','<select id="f-country">'+opts(COUNTRIES,c.country||'')+'</select>')}</div>
      <div class="row2">${field('Stage','<select id="f-stage">'+opts(STAGES.map(s=>[s.k,s.l]),c.stage)+'</select>')}${field('Currency','<select id="f-cur">'+opts(CUR,c.currency||'')+'</select>')}</div>
      <div class="row2">${field('Deal value','<input id="f-deal" type="number" inputmode="decimal" value="'+(c.deal_value||0)+'">')}${field('Amount paid','<input id="f-paid" type="number" inputmode="decimal" value="'+(c.amount_paid||0)+'">')}</div>
      ${field('Next follow-up','<input id="f-date" type="date" value="'+(c.next_action_date||'')+'">')}
      ${field('Notes','<textarea id="f-notes">'+esc(c.notes||'')+'</textarea>')}
      <button class="save" id="f-save">${isNew?'Add client':'Save changes'}</button>
      ${isNew?'':'<button class="del" id="f-del">Delete client</button>'}
      <button class="close" id="f-close">Close</button>
      <div class="log ${isNew?'hidden':''}" id="f-log"></div>
    </div>`));
  bg.onclick=()=>bg.remove();
  document.body.appendChild(bg);
  $('#f-save').onclick = ()=>saveClient(bg,isNew,c);
  $('#f-close').onclick = ()=>bg.remove();
  if(!isNew){ $('#f-del').onclick=()=>delClient(bg,c); loadLog(id); }
}

async function saveClient(bg,isNew,orig){
  const rec = {
    name:$('#f-name').value.trim(), email:$('#f-email').value.trim()||null, phone:$('#f-phone').value.trim()||null,
    service:$('#f-service').value||null, country:$('#f-country').value||null, currency:$('#f-cur').value||null,
    stage:$('#f-stage').value, deal_value:Number($('#f-deal').value||0), amount_paid:Number($('#f-paid').value||0),
    next_action_date:$('#f-date').value||null, notes:$('#f-notes').value.trim()||null,
  };
  if(!rec.name){ toast('Name required'); return; }
  $('#f-save').textContent='Saving…';
  if(isNew){
    rec.source='manual';
    const { data,error } = await sb.from('hq_clients').insert(rec).select('id').single();
    if(error){ toast('Save failed'); $('#f-save').textContent='Add client'; return; }
    await sb.from('hq_activity').insert({ client_id:data.id, kind:'note', body:'Client added manually' });
  } else {
    const { error } = await sb.from('hq_clients').update(rec).eq('id',orig.id);
    if(error){ toast('Save failed'); $('#f-save').textContent='Save changes'; return; }
    if(orig.stage!==rec.stage)
      await sb.from('hq_activity').insert({ client_id:orig.id, kind:'stage_change', body:'Stage → '+(STAGES.find(s=>s.k===rec.stage)?.l||rec.stage) });
  }
  bg.remove(); toast('Saved'); load();
}

async function delClient(bg,c){
  if(!confirm('Delete '+c.name+'? This cannot be undone.')) return;
  const { error } = await sb.from('hq_clients').delete().eq('id',c.id);
  if(error){ toast('Delete failed'); return; }
  bg.remove(); toast('Deleted'); load();
}

async function loadLog(id){
  const { data } = await sb.from('hq_activity').select('*').eq('client_id',id).order('created_at',{ascending:false});
  const box=$('#f-log'); if(!box) return;
  box.innerHTML = `<h3>Activity</h3>
    <div class="note-row"><input id="note-in" placeholder="Add a note…"><button id="note-add">Add</button></div>
    <div id="log-items"></div>`;
  const items=$('#log-items');
  items.innerHTML = (data||[]).map(a=>`<div class="log-item">${esc(a.body)}<div class="t">${new Date(a.created_at).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>`).join('') || '<div class="log-item" style="color:var(--mut)">No activity yet.</div>';
  $('#note-add').onclick = async ()=>{
    const v=$('#note-in').value.trim(); if(!v) return;
    await sb.from('hq_activity').insert({ client_id:id, kind:'note', body:v });
    $('#note-in').value=''; loadLog(id);
  };
}

$('#add').onclick = ()=>openDetail(null);

/* ---------- push ---------- */
function urlB64ToUint8(base64){
  const pad='='.repeat((4-base64.length%4)%4); const b=(base64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b); return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function currentSub(){ if(!('serviceWorker'in navigator))return null; const r=await navigator.serviceWorker.ready; return r.pushManager.getSubscription(); }
async function refreshBell(){ const s=await currentSub(); $('#bell').classList.toggle('on',!!s); }
$('#bell').onclick = async ()=>{
  try{
    if(!('serviceWorker'in navigator)||!('PushManager'in window)){ toast('Push not supported here'); return; }
    const reg = await navigator.serviceWorker.register('./sw.js');
    await navigator.serviceWorker.ready;
    const existing = await reg.pushManager.getSubscription();
    if(existing){ toast('Alerts already on'); $('#bell').classList.add('on'); return; }
    const perm = await Notification.requestPermission();
    if(perm!=='granted'){ toast('Notifications blocked'); return; }
    const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlB64ToUint8(VAPID_PUBLIC) });
    const j = sub.toJSON();
    const { error } = await sb.from('hq_push_subs').upsert(
      { endpoint:sub.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, ua:navigator.userAgent },
      { onConflict:'endpoint' });
    if(error){ toast('Could not save alerts'); return; }
    $('#bell').classList.add('on'); toast('🔔 Lead alerts on');
  }catch(e){ toast('Alerts failed'); }
};

if('serviceWorker'in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  boot();
}

// Resilient loader — some networks (parts of Oman/India) block certain CDNs, so try several in order.
(function load(cdns){
  if(window.supabase) return initApp();
  if(!cdns.length){
    const m=document.getElementById('login-msg');
    if(m){ m.classList.remove('hidden'); m.textContent="Couldn't load on this network — try another connection or Wi-Fi."; m.style.color='#ff4d4d'; }
    return;
  }
  const s=document.createElement('script'); s.src=cdns[0];
  s.onload=()=> window.supabase ? initApp() : load(cdns.slice(1));
  s.onerror=()=> load(cdns.slice(1));
  document.head.appendChild(s);
})([
  'https://unpkg.com/@supabase/supabase-js@2',
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
  'https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.39.7/supabase.min.js'
]);
</script>
